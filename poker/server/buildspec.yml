version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$IMAGE_REGISTRY"
  build:
    commands:
      - docker build -t "$IMAGE_REPOSITORY:latest" .
  post_build:
    commands:
      - docker push "$IMAGE_REPOSITORY:latest"
